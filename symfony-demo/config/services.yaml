# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.supported_locales: 'en|fr'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    ### COSE ###
    # The bundle registers RS1 (RSASSA-PKCS1-v1_5 with SHA-1) so that signatures produced by legacy authenticators
    # can still be verified, but it builds it without acknowledging that the algorithm is insecure. The library then
    # emits an E_USER_WARNING, which the dev environment turns into an exception. Overriding the definition keeps the
    # algorithm available and silences the warning.
    webauthn.cose.algorithm.RS1:
        class: Cose\Algorithm\Signature\RSA\RS1
        arguments:
            - true

    ### MDS ###
    App\Metadata\SingleFileService:
        tags:
            - 'webauthn.mds_service'
        arguments:
            - '%kernel.project_dir%'
            - '@serializer'

    fido_alliance:
        class: Webauthn\MetadataService\Service\FidoAllianceCompliantMetadataService
        tags:
            - 'webauthn.mds_service'
        arguments:
            - '@Symfony\Contracts\HttpClient\HttpClientInterface'
            - 'https://mds.fidoalliance.org/'
            - []
            - '@Webauthn\MetadataService\CertificateChain\PhpCertificateChainValidator'
            - 'https://secure.globalsign.com/cacert/root-r3.crt'
            - '@serializer'

    App\Repository\MetadataStatementRepository:
        arguments:
            - '@cache.app'

    App\Cache\LoadMetadataStatementsAndStatusReports:
        arguments:
            - '@App\Repository\MetadataStatementRepository'
            - '@App\Repository\StatusReportRepository'
            - !tagged_iterator webauthn.mds_service
