version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/symfony-demo"
    schedule:
      interval: "weekly"
      day: "friday"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    groups:
      symfony:
        patterns:
          - "symfony/*"
          - "symfonycasts/*"
      doctrine:
        patterns:
          - "doctrine/*"
      webauthn:
        patterns:
          - "web-auth/*"
          - "web-token/*"
      others:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]
    groups:
      actions:
        patterns:
          - "*"
